<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — AI Jobline</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container-narrow">
  <h1>Set a new password</h1>
  <p class="muted">Choose a new password for your account.</p>

  <div id="alert-box"></div>

  <form id="reset-form">
    <label for="new_password">New password</label>
    <input type="password" id="new_password" required minlength="8">
    <p class="field-hint">At least 8 characters.</p>

    <label for="confirm_password">Confirm new password</label>
    <input type="password" id="confirm_password" required minlength="8">

    <button type="submit" class="btn btn-primary btn-block" style="margin-top:24px;" id="submit-btn">Reset password</button>
  </form>

  <p class="muted text-center" style="margin-top:20px;">
    <a href="login.html">Back to log in</a>
  </p>
</main>

<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script>
  renderHeader();

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  const form = document.getElementById("reset-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");

  if (!token) {
    form.style.display = "none";
    alertBox.innerHTML = `<div class="alert alert-error">
      This reset link is missing its token. Please use the link from your email,
      or <a href="forgot-password.html">request a new one</a>.
    </div>`;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.innerHTML = "";

    const newPassword = document.getElementById("new_password").value;
    const confirmPassword = document.getElementById("confirm_password").value;

    if (newPassword !== confirmPassword) {
      alertBox.innerHTML = `<div class="alert alert-error">Passwords don't match.</div>`;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Resetting…";

    try {
      const result = await Api.post("/api/auth/reset-password", { token, new_password: newPassword });
      alertBox.innerHTML = `<div class="alert alert-success">${escapeHtml(result.detail)}</div>`;
      form.style.display = "none";
      setTimeout(() => { window.location.href = "login.html"; }, 2000);
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = "Reset password";
    }
  });
</script>
</body>
</html>
