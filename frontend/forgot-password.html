<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — AI Jobline</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container-narrow">
  <h1>Forgot your password?</h1>
  <p class="muted">Enter your email and we'll send you a link to reset it.</p>

  <div id="alert-box"></div>

  <form id="forgot-form">
    <label for="email">Email</label>
    <input type="email" id="email" required>

    <button type="submit" class="btn btn-primary btn-block" style="margin-top:24px;" id="submit-btn">Send reset link</button>
  </form>

  <p class="muted text-center" style="margin-top:20px;">
    Remembered it after all? <a href="login.html">Log in</a>
  </p>
</main>

<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script>
  renderHeader();
  if (Api.isLoggedIn()) window.location.href = "index.html";

  const form = document.getElementById("forgot-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    try {
      const email = document.getElementById("email").value.trim();
      const result = await Api.post("/api/auth/forgot-password", { email });

      let html = `<div class="alert alert-success">${escapeHtml(result.detail)}</div>`;
      if (result.dev_reset_link) {
        html += `<div class="alert alert-success" style="margin-top:-8px;">
          <strong>Dev mode:</strong> no email server is configured for this deployment,
          so here's your reset link directly —
          <a href="${escapeHtml(result.dev_reset_link)}">${escapeHtml(result.dev_reset_link)}</a>
        </div>`;
      }
      alertBox.innerHTML = html;
      form.reset();
      submitBtn.textContent = "Send reset link";
      submitBtn.disabled = false;
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = "Send reset link";
    }
  });
</script>
</body>
</html>
