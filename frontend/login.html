<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — AI Jobline</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container-narrow">
  <h1>Log in</h1>
  <p class="muted">Welcome back. Enter your details to continue.</p>

  <div id="alert-box"></div>

  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" required>
    <p class="field-hint" style="text-align:right; margin-top:6px;"><a href="forgot-password.html">Forgot password?</a></p>

    <button type="submit" class="btn btn-primary btn-block" style="margin-top:12px;" id="submit-btn">Log in</button>
  </form>

  <p class="muted text-center" style="margin-top:20px;">
    Don't have an account? <a href="register.html">Sign up</a>
  </p>
</main>

<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script>
  renderHeader("login");
  if (Api.isLoggedIn()) window.location.href = "index.html";

  const form = document.getElementById("login-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";

    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const { access_token } = await Api.login(email, password);
      Api.setToken(access_token);

      // Fetch role by trying job-seeker profile first, then employer.
      // (A dedicated /api/auth/me endpoint is a natural addition if you extend this.)
      try {
        await Api.get("/api/job-seekers/me");
        localStorage.setItem("user_role", "job_seeker");
        window.location.href = "seeker-dashboard.html";
      } catch {
        try {
          await Api.get("/api/employers/me");
          localStorage.setItem("user_role", "employer");
          window.location.href = "employer-dashboard.html";
        } catch {
          window.location.href = "index.html";
        }
      }
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = "Log in";
    }
  });
</script>
</body>
</html>
