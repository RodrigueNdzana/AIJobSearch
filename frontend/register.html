<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up - AI Jobline</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container-narrow">
  <h1>Create your account</h1>
  <p class="muted">Choose how you will use the platform.</p>

  <div id="alert-box"></div>

  <form id="register-form">
    <label for="role">I am a</label>
    <select id="role" required>
      <option value="job_seeker">Job seeker - looking for work</option>
      <option value="employer">Employer - hiring for my company</option>
    </select>

    <label id="name-label" for="full_name">Full name</label>
    <input type="text" id="full_name" required>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" required minlength="8">
    <p class="field-hint">At least 8 characters.</p>

    <button type="submit" class="btn btn-primary btn-block" style="margin-top:24px;" id="submit-btn">Create account</button>
  </form>

  <p class="muted text-center" style="margin-top:20px;">
    Already have an account? <a href="login.html">Log in</a>
  </p>
</main>

<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script>
  renderHeader("register");
  if (Api.isLoggedIn()) window.location.href = "index.html";

  const roleSelect = document.getElementById("role");
  const nameLabel = document.getElementById("name-label");
  const nameInput = document.getElementById("full_name");

  roleSelect.addEventListener("change", () => {
    if (roleSelect.value === "employer") {
      nameLabel.textContent = "Company name";
      nameInput.placeholder = "e.g. Acme Robotics";
    } else {
      nameLabel.textContent = "Full name";
      nameInput.placeholder = "e.g. Jordan Lee";
    }
  });

  const form = document.getElementById("register-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account…";

    try {
      const payload = {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        role: roleSelect.value,
        full_name: nameInput.value.trim(),
      };
      const { access_token } = await Api.post("/api/auth/register", payload);
      Api.setToken(access_token);
      localStorage.setItem("user_role", payload.role);
      window.location.href = payload.role === "employer" ? "employer-dashboard.html" : "seeker-dashboard.html";
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
